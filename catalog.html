<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Справочник долгов и патчей uChurch: части проекта, номера, даты и подтверждённые источники.">
  <meta name="theme-color" content="#101619">
  <link rel="canonical" href="https://sunpole.github.io/uChurch-public/catalog.html">
  <title>uChurch — справочник долгов и патчей</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/work-directory.css?v=v17.11.115">
</head>
<body>
  <a class="skip-link" href="#directory-results" data-ru="К списку задач" data-en="Skip to items">К списку задач</a>
  <header class="directory-header">
    <a class="brand" href="index.html"><img src="assets/favicon.svg" width="36" height="36" alt="">uChurch</a>
    <nav aria-label="Navigation"><a href="catalog.html" aria-current="page" data-ru="Справочник" data-en="Directory">Справочник</a><a href="index.html#history" data-ru="История версий" data-en="Version history">История версий</a><a href="index.html" data-ru="Витрина" data-en="Showcase">Витрина</a><a href="https://uchurch.pro/" data-ru="Главная проекта" data-en="Project home">Главная проекта</a></nav>
    <div class="languages"><button type="button" data-language="ru">RU</button><button type="button" data-language="en">EN</button></div>
  </header>
  <main>
    <div class="directory-heading"><div><div class="title-line"><h1 data-ru="Долги и патчи" data-en="Debts and patches">Долги и патчи</h1><span class="version">v17.11.115</span></div><p data-summary></p></div></div>
    <form id="filters" role="search">
      <div class="status-switch" aria-label="Type">
        <button type="button" data-kind=""><span data-ru="Все" data-en="All">Все</span><span data-total></span></button>
        <button type="button" data-kind="debt"><span data-ru="Долги" data-en="Debts">Долги</span><span data-total></span></button>
        <button type="button" data-kind="patch"><span data-ru="Патчи" data-en="Patches">Патчи</span><span data-total></span></button>
      </div>
      <input type="hidden" name="kind">
      <div class="toolbar">
        <label class="search-field"><span class="sr-only" data-ru="Поиск" data-en="Search">Поиск</span><img class="icon" src="assets/icons/search.svg" alt=""><input name="query" type="search" maxlength="300" autocomplete="off"></label>
        <details id="advanced-filters">
          <summary><img class="icon" src="assets/icons/sliders-horizontal.svg" alt=""><span data-ru="Фильтры" data-en="Filters">Фильтры</span><span data-filter-count hidden></span><img class="icon small" src="assets/icons/chevron-down.svg" alt=""></summary>
          <div class="filter-panel">
            <div class="panel-heading"><h2 data-ru="Фильтры" data-en="Filters">Фильтры</h2><button class="icon-button" type="button" data-close-filters data-label-ru="Закрыть фильтры" data-label-en="Close filters"><img class="icon" src="assets/icons/x.svg" alt=""></button></div>
            <label><span data-ru="Точный номер" data-en="Exact number">Точный номер</span><input name="number" type="number" min="1" step="1" inputmode="numeric"></label>
            <fieldset><legend data-ru="Часть проекта" data-en="Project part">Часть проекта</legend><div class="part-options" data-parts></div></fieldset>
            <div class="filter-dates">
              <fieldset><legend data-ru="Дата создания" data-en="Creation date">Дата создания</legend><div class="date-range"><label><span data-ru="С" data-en="From">С</span><input type="date" name="createdFrom"></label><label><span data-ru="По" data-en="To">По</span><input type="date" name="createdTo"></label></div></fieldset>
              <fieldset><legend data-ru="Дата реализации" data-en="Implementation date">Дата реализации</legend><div class="date-range"><label><span data-ru="С" data-en="From">С</span><input type="date" name="implementedFrom"></label><label><span data-ru="По" data-en="To">По</span><input type="date" name="implementedTo"></label></div></fieldset>
            </div>
          </div>
        </details>
        <label class="sort-field"><span class="sr-only" data-ru="Порядок" data-en="Order">Порядок</span><select name="sort"></select></label>
        <button class="reset-button" type="reset" data-label-ru="Сбросить фильтры" data-label-en="Reset filters"><img class="icon" src="assets/icons/rotate-ccw.svg" alt=""><span data-ru="Сбросить" data-en="Reset">Сбросить</span></button>
      </div>
      <div data-applied class="applied-filters"></div>
      <p id="filter-error" class="error" role="alert" hidden></p>
    </form>
    <section id="directory-results" aria-label="Directory results" tabindex="-1">
      <div class="results-toolbar"><p data-count role="status" aria-live="polite">Загрузка…</p><label><span data-ru="На странице" data-en="Per page">На странице</span><select name="pageSize" form="filters"><option>25</option><option>50</option><option>100</option></select></label></div>
      <div class="column-headings" aria-hidden="true"><span>№ / ID</span><span data-ru="Задача и описание" data-en="Item and description">Задача и описание</span><span data-ru="Части проекта" data-en="Project parts">Части проекта</span><span class="date-column" data-ru="Создано" data-en="Created">Создано</span><span class="date-column" data-ru="Реализовано" data-en="Implemented">Реализовано</span><span></span></div>
      <div data-results></div>
      <div class="pagination"><button type="button" class="icon-button" data-prev data-label-ru="Предыдущая страница" data-label-en="Previous page"><img class="icon" src="assets/icons/chevron-left.svg" alt=""></button><span data-page></span><button type="button" class="icon-button" data-next data-label-ru="Следующая страница" data-label-en="Next page"><img class="icon" src="assets/icons/chevron-right.svg" alt=""></button></div>
    </section>
    <noscript>Для фильтров нужен JavaScript. <a href="docs/development-debt.ru.md">Открыть текстовый список долгов</a>.</noscript>
  </main>
  <dialog id="item-detail" aria-labelledby="detail-title">
    <div class="detail-top"><span data-detail-number></span><button type="button" class="icon-button" data-close-detail data-label-ru="Назад к списку" data-label-en="Back to list"><img class="icon" src="assets/icons/x.svg" alt=""></button></div>
    <div data-detail-body></div>
  </dialog>
  <footer><a href="docs/work-directory.md" data-ru="Правила и источники" data-en="Rules and sources">Правила и источники</a><a href="index.html#history" data-ru="Прежняя история версий" data-en="Earlier version history">Прежняя история версий</a><a href="https://github.com/sunpole/uChurch-public">GitHub</a><span class="version">v17.11.115</span></footer>
  <script type="module" src="assets/work-directory.js?v=v17.11.115"></script>
</body>
</html>
